{% extends 'base.html' %}


{% block content %}

<div class="card p-4 col-md-6 mx-auto">
    <h4 class="mb-3">
        <i class="fa fa-user-plus"></i>Add Student

    </h4>
    <form action="/add" method="POST">
        <div><input type="text" name="id" class="form-control mb-3" placeholder="ID Number"></div>
        <div><input type="text" name="name" class="form-control mb-3" placeholder="Enter Name"></div>
        <div><input type="email" name="email" class="form-control mb-3" placeholder="Enter Email"></div>
        <div><input type="text" name="course" class="form-control mb-3" placeholder="Enter Course"></div>

        <button class="btn btn-success w-100">
            <i class="fa fa-save"></i> Save Student
        </button>
    </form>


</div>

{% endblock %}
